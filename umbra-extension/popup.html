<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umbra</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <img class="brandmark" src="icons/icon32.png" alt="" />
        <h1>Umbra</h1>
        <label class="switch" title="Turn Umbra on or off">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider" aria-hidden="true"></span>
          <span class="sr-only">Turn Umbra on or off</span>
        </label>
      </header>

      <section class="page-state" aria-live="polite">
        <div class="site-line">
          <span class="status-dot" id="statusDot" aria-hidden="true"></span>
          <strong id="hostname">Current page</strong>
        </div>
        <p id="siteState">Getting ready</p>
      </section>

      <button id="primaryAction" class="primary" disabled>Getting ready</button>

      <section class="darkness-control" aria-labelledby="darknessLabel">
        <div class="control-heading">
          <label id="darknessLabel" for="darknessSlider">Surroundings</label>
          <output id="darknessValue" for="darknessSlider">74%</output>
        </div>
        <input
          id="darknessSlider"
          type="range"
          min="0.45"
          max="0.9"
          step="0.01"
          aria-label="Surrounding darkness"
        />
        <div class="range-labels" aria-hidden="true">
          <span>Lighter</span>
          <span>Darker</span>
        </div>
      </section>

      <label class="site-control" for="siteModeSelect">
        <span>On this site</span>
        <select id="siteModeSelect">
          <option value="auto">Automatic</option>
          <option value="manual">On request</option>
          <option value="off">Off</option>
        </select>
      </label>

      <footer class="footer-actions">
        <button id="pauseTab" class="secondary">Pause tab</button>
        <button id="openOptions" class="plain">Settings</button>
      </footer>
    </main>
    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
