<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umbra</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="topbar">
        <div class="brandmark" aria-hidden="true"></div>
        <div class="title">
          <h1>Umbra</h1>
          <p id="subtitle">Focus for this page</p>
        </div>
        <label class="switch" title="Enable Umbra">
          <input type="checkbox" id="enabledToggle" />
          <span class="slider"></span>
        </label>
      </header>

      <section class="site-panel">
        <div class="site-head">
          <span class="label">Current site</span>
          <strong id="hostname">Current page</strong>
        </div>
        <div class="status-row">
          <span class="badge" id="siteState">Checking</span>
          <span class="badge muted" id="siteModeBadge">Auto</span>
        </div>
      </section>

      <section class="actions-grid">
        <button id="focusNow" class="primary">Focus</button>
        <button id="pinNow" class="secondary">Pin</button>
        <button id="pauseTab" class="secondary wide">Pause tab</button>
      </section>

      <details class="site-controls" id="siteControls">
        <summary>
          <span>Site behavior</span>
          <strong id="siteModeText">Auto</strong>
        </summary>
        <div class="mode-grid" role="group" aria-label="Site behavior">
          <button id="siteModeAuto" class="secondary mode-btn">Auto</button>
          <button id="siteModeManual" class="secondary mode-btn">Manual</button>
          <button id="siteModeOff" class="secondary mode-btn">Off</button>
        </div>
      </details>

      <footer class="footer">
        <button id="openOptions" class="linklike">Settings</button>
      </footer>
    </main>
    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
