<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Umbra settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <div class="identity">
          <img src="icons/icon48.png" width="36" height="36" alt="" />
          <h1>Settings</h1>
        </div>
        <span id="status" role="status" aria-live="polite"></span>
      </header>

      <form id="settingsForm">
        <section class="settings-section" aria-labelledby="behaviorHeading">
          <h2 id="behaviorHeading">Behavior</h2>
          <div class="setting-list">
            <label class="setting-row">
              <span>Automatic focus</span>
              <input type="checkbox" id="automaticFocus" />
            </label>
            <label class="setting-row">
              <span>Focus outline</span>
              <input type="checkbox" id="showOutline" />
            </label>
          </div>
        </section>

        <section class="settings-section" aria-labelledby="sitesHeading">
          <div class="section-heading">
            <h2 id="sitesHeading">Sites</h2>
            <span id="siteCount"></span>
          </div>
          <div id="siteOverrides" class="site-list"></div>
        </section>

        <section class="settings-section" aria-labelledby="otherHeading">
          <h2 id="otherHeading">Other</h2>
          <div class="button-list">
            <button type="button" id="shortcuts" class="row-button">
              Keyboard shortcuts
            </button>
            <button type="button" id="reset" class="row-button danger">
              Restore defaults
            </button>
          </div>
        </section>
      </form>
    </main>
    <script src="defaults.js"></script>
    <script src="options.js"></script>
  </body>
</html>
