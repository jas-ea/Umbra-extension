<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Umbra product poster</title>
  <desc id="desc">Umbra darkening the page around an issue list on GitHub.</desc>
  <defs>
    <clipPath id="shotClip">
      <rect x="506" y="112" width="646" height="404" rx="10"/>
    </clipPath>
  </defs>
  <rect width="1200" height="628" fill="#111214"/>
  <g transform="translate(44 33) scale(.105)">
    <rect x="48" y="48" width="416" height="416" rx="96" fill="#1b1c1f" stroke="#343840" stroke-width="8"/>
    <rect x="128" y="132" width="256" height="18" rx="9" fill="#6f747d"/>
    <rect x="88" y="188" width="336" height="136" rx="24" fill="#f4f3ee"/>
    <rect x="112" y="212" width="12" height="88" rx="6" fill="#bce75b"/>
    <rect x="128" y="362" width="256" height="18" rx="9" fill="#6f747d"/>
  </g>
  <text x="112" y="81" fill="#f4f3ee" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing="0">Umbra</text>
  <text x="44" y="184" fill="#f4f3ee" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="50" font-weight="730" letter-spacing="0">
    <tspan x="44" dy="0">Darken the page</tspan>
    <tspan x="44" dy="58">around what</tspan>
    <tspan x="44" dy="58">you're using.</tspan>
  </text>
  <text x="46" y="406" fill="#c3c7ce" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="430" letter-spacing="0">
    <tspan x="46" dy="0">Pause on a section. Umbra keeps it clear</tspan>
    <tspan x="46" dy="32">and darkens everything around it.</tspan>
  </text>
  <text x="46" y="559" fill="#8b9099" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="530" letter-spacing="0">Open-source Chrome extension by Cassini Research</text>
  <rect x="492" y="98" width="674" height="432" rx="14" fill="#090a0b" stroke="#343840" stroke-width="1"/>
  <image href="../screenshots/github-openai-cookbook-issues.png" x="506" y="112" width="646" height="404" preserveAspectRatio="xMidYMid meet" clip-path="url(#shotClip)"/>
  <rect x="506" y="112" width="646" height="404" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
</svg>
