<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc">
  <title id="title">Umbra launch poster</title>
  <desc id="desc">Umbra shown on a real Stack Overflow question list.</desc>
  <defs>
    <clipPath id="shotClip">
      <rect x="544" y="91" width="600" height="446" rx="10"/>
    </clipPath>
  </defs>
  <rect width="1200" height="628" fill="#111214"/>
  <g transform="translate(54 40) scale(.16)" stroke="#f4f3ee" stroke-width="16" stroke-linejoin="round">
    <rect x="76" y="116" width="278" height="72" rx="8" fill="#111214"/>
    <rect x="158" y="220" width="278" height="72" rx="8" fill="#bce75b"/>
    <rect x="76" y="324" width="278" height="72" rx="8" fill="#111214"/>
  </g>
  <text x="138" y="92" fill="#f4f3ee" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="30" font-weight="720" letter-spacing="0">Umbra</text>
  <rect x="54" y="124" width="42" height="5" rx="2.5" fill="#bce75b"/>
  <text x="54" y="212" fill="#f4f3ee" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="740" letter-spacing="0">
    <tspan x="54" dy="0">Keep your place</tspan>
    <tspan x="54" dy="64">on busy pages.</tspan>
  </text>
  <text x="56" y="360" fill="#bfc3ca" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="440" letter-spacing="0">
    <tspan x="56" dy="0">The page dims around one block.</tspan>
    <tspan x="56" dy="34">The original site stays interactive.</tspan>
  </text>
  <text x="56" y="552" fill="#858b95" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="540" letter-spacing="0">Chrome extension by Cassini Research</text>
  <rect x="530" y="77" width="628" height="474" rx="14" fill="#090a0b" stroke="#343840" stroke-width="1"/>
  <image href="../screenshots/stackoverflow-questions.png" x="544" y="91" width="600" height="446" preserveAspectRatio="xMidYMid slice" clip-path="url(#shotClip)"/>
  <rect x="544" y="91" width="600" height="446" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.16"/>
</svg>
