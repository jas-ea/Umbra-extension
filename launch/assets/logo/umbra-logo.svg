<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Umbra logo</title>
  <desc id="desc">Umbra wordmark with a soft focus mark.</desc>
  <defs>
    <radialGradient id="focus" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f4f2ff"/>
      <stop offset="52%" stop-color="#d7d2ff"/>
      <stop offset="100%" stop-color="#8ea7ff"/>
    </radialGradient>
    <linearGradient id="rim" x1="48" y1="40" x2="272" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="54%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#5b6ee1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="56" fill="#f8fafc"/>
  <g transform="translate(44 40)">
    <rect width="240" height="240" rx="58" fill="#0b0d12"/>
    <circle cx="120" cy="120" r="75" fill="none" stroke="url(#rim)" stroke-width="25"/>
    <circle cx="120" cy="120" r="35" fill="url(#focus)"/>
    <path d="M58 120c0-34 28-62 62-62" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="340" y="156" fill="#101216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="92" font-weight="760" letter-spacing="0">Umbra</text>
  <text x="346" y="214" fill="#4b5563" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="480" letter-spacing="0">Soft focus for the live web</text>
  <text x="980" y="276" fill="#6b7280" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="560" text-anchor="end" letter-spacing="0">Cassini Research</text>
</svg>
