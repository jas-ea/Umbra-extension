      <stop offset="100%" stop-color="#8ea7ff"/>
    </radialGradient>
    <linearGradient id="rim" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="54%" stop-color="#1f2937"/>
