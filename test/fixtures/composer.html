<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Umbra fixture - composer</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f4f6f8; color: #111; }
    main { width: 760px; margin: 64px auto; }
    form { padding: 24px; background: white; border: 1px solid #d5d8dc; border-radius: 8px; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; }
    button { margin-top: 12px; }
  </style>
</head>
<body>
  <script>window.__UMBRA_TEST_HOOKS__ = true;</script>
  <main>
    <form id="composer-shell">
      <label for="composer-text">Reply</label>
      <textarea id="composer-text" rows="5">Draft text</textarea>
      <button type="button">Send</button>
      <button type="button">Attach</button>
    </form>
  </main>
</body>
</html>
